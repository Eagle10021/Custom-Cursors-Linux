            const Moon = (p) => (

            const Smartphone = (p) => (

            const Globe = (p) => (
                <Icon {...p}>
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="2" y1="12" x2="22" y2="12"></line>
                    <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
                </Icon>
            );
            const ChevronDown = (p) => (
                <Icon {...p}>
                    <polyline points="6 9 12 15 18 9"></polyline>
                </Icon>
            );

            // --- TRANSLATIONS ---
            // Modular localization loaded from js/locales.js
            const translations = window.CursorPortTranslations || window.translations || {};

            const CP = window.CursorPort;

            // Storage can be blocked (private windows, strict settings); the page
            // still works, it just forgets settings.
            const storage = {
                get: (k) => {
                    try {
                        return localStorage.getItem(k);
                    } catch (e) {
                        return null;
                    }
                },
                set: (k, v) => {
                    try {
                        localStorage.setItem(k, v);
                    } catch (e) {
                        /* ignore */
                    }
                },
                remove: (k) => {
                    try {
                        localStorage.removeItem(k);
                    } catch (e) {
                        /* ignore */
                    }
                },
            };

            // v3 saved the author's own paths as defaults for every visitor.
            // Those exact values are cleared once so the page starts neutral.
            (() => {
                const old = {
                    cp_themeName: '"Shorekeeper"',
                    cp_sourcePath: '"/home/eagle/Documents/Custom Cursors/Shorekeeper/Cursors"',
                };
                Object.entries(old).forEach(([k, v]) => {
                    if (storage.get(k) === v) storage.remove(k);
                });
                storage.remove('cp_username');
            })();

            const DEFAULTS = {
                themeName: 'MyCursors',
                sourcePath: '~/Downloads/MyCursors',
                cursorSize: 32,
                installPath: '$HOME/.local/share/icons',
            };

            // --- PERSISTENCE HELPER (defined outside App to avoid re-creation on render) ---
            const useStickyState = (defaultValue, key) => {
                const [value, setValue] = React.useState(() => {
                    const stickyValue = storage.get(key);
                    if (stickyValue !== null) {
                        try {
                            const parsed = JSON.parse(stickyValue);
                            // Merge objects to ensure new default keys show up
                            if (
                                typeof defaultValue === 'object' &&
                                defaultValue !== null &&
                                !Array.isArray(defaultValue)
                            ) {
                                return { ...defaultValue, ...parsed };
                            }
                            return parsed;
                        } catch (e) {
                            return defaultValue;
                        }
                    }
                    return defaultValue;
                });
                React.useEffect(() => {
                    storage.set(key, JSON.stringify(value));
                }, [key, value]);
                return [value, setValue];
            };

            // --- USER PACK HELPERS ---
            const CURSOR_EXT = /\.(ani|cur)$/i;
            const PACK_EXT = /\.(ani|cur|inf|zip)$/i;
            const dirOf = (p) => (p.includes('/') ? p.slice(0, p.lastIndexOf('/')) : '');

            // Collects files from a drop, walking into dropped folders.
            // webkitGetAsEntry must run before the first await, while the drop event is live.
            const collectDropped = (dataTransfer) => {
                const entries = [...(dataTransfer.items || [])]
                    .map((it) => (it.webkitGetAsEntry ? it.webkitGetAsEntry() : null))
                    .filter(Boolean);
                const plainFiles = [...(dataTransfer.files || [])];
                return (async () => {
                    if (!entries.length) return plainFiles.map((f) => ({ path: f.name, file: f }));
                    const out = [];
                    const readEntry = (entry, prefix) =>
                        new Promise((resolve) => {
                            if (entry.isFile) {
                                entry.file(
                                    (f) => {
                                        out.push({ path: prefix + f.name, file: f });
                                        resolve();
                                    },
                                    () => resolve()
                                );
                            } else if (entry.isDirectory) {
                                const reader = entry.createReader();
                                const all = [];
                                const more = () =>
                                    reader.readEntries(
                                        async (batch) => {
                                            if (batch.length) {
                                                all.push(...batch);
                                                more();
                                                return;
                                            }
                                            for (const e of all)
                                                await readEntry(e, prefix + entry.name + '/');
                                            resolve();
                                        },
                                        () => resolve()
                                    );
                                more();
                            } else resolve();
                        });
                    for (const e of entries) await readEntry(e, '');
                    return out;
                })();
            };

            // Reads picked/dropped files into a pack: parsed cursors from the folder
            // holding the most cursor files, plus a role mapping from install.inf
            // (or from the file names when there is no usable install.inf).
            const readPack = async (items) => {
                const files = [];
                const errors = [];
                for (const it of items.filter((i) => PACK_EXT.test(i.path))) {
                    const bytes = new Uint8Array(await it.file.arrayBuffer());
                    if (/\.zip$/i.test(it.path)) {
                        try {
                            const base = it.path.replace(/\.zip$/i, '');
                            (await CP.readZip(bytes)).forEach((z) =>
                                files.push({ path: `${base}/${z.path}`, bytes: z.bytes })
                            );
                        } catch (e) {
                            errors.push(`${CP.baseName(it.path)}: ${e.message}`);
                        }
                    } else files.push({ path: it.path, bytes });
                }
                const cursorFiles = files.filter(
                    (f) => CURSOR_EXT.test(f.path) && !/(^|\/)__MACOSX\//.test(f.path)
                );
                if (!cursorFiles.length) return { empty: true, errors };

                const counts = {};
                cursorFiles.forEach((f) => {
                    const d = dirOf(f.path);
                    counts[d] = (counts[d] || 0) + 1;
                });
                const mainDir = Object.keys(counts).sort((a, b) => counts[b] - counts[a])[0];

                const cursors = new Map();
                // .ani first, so an animated file wins over a static one with the same name.
                const inMain = cursorFiles
                    .filter((f) => dirOf(f.path) === mainDir)
                    .sort(
                        (a, b) =>
                            (/\.ani$/i.test(b.path) ? 1 : 0) - (/\.ani$/i.test(a.path) ? 1 : 0)
                    );
                for (const f of inMain) {
                    const name = CP.stripExt(CP.baseName(f.path));
                    if (cursors.has(name)) continue;
                    try {
                        cursors.set(name, await CP.parseCursor(f.bytes, f.path));
                    } catch (e) {
                        errors.push(`${CP.baseName(f.path)}: ${e.message}`);
                    }
                }
                const names = [...cursors.keys()];
                const lower = new Map(names.map((n) => [n.toLowerCase(), n]));

                // Prefer the install.inf next to the cursors, then any whose names match.
                const infs = files
                    .filter((f) => /\.inf$/i.test(f.path))
                    .map((f) => {
                        const parsed = CP.parseInf(f.bytes);
                        const hits = Object.values(parsed.mapping).filter((v) =>
                            lower.has(v.toLowerCase())
                        ).length;
                        return { ...parsed, hits, near: dirOf(f.path) === mainDir };
                    })
                    .sort((a, b) => b.near - a.near || b.hits - a.hits);
                const inf = infs.find((i) => i.hits > 0);

                const infMapping = {};
                if (inf)
                    Object.entries(inf.mapping).forEach(([k, v]) => {
                        if (lower.has(v.toLowerCase())) infMapping[k] = lower.get(v.toLowerCase());
                    });
                const merged = { ...CP.guessMapping(names), ...infMapping };
                const mapping = {};
                CP.ROLES.forEach((r) => {
                    mapping[r.key] = merged[r.key] || '';
                });

                const topFolder = (cursorFiles[0].path.split('/')[0] || '').replace(/\.zip$/i, '');
                const themeName = CP.sanitizeThemeName(
                    (inf && inf.schemeName) ||
                        (topFolder && topFolder !== CP.baseName(cursorFiles[0].path)
                            ? topFolder
                            : 'MyCursors')
                );
                return {
                    cursors,
                    names,
                    mapping,
                    mainDir,
                    themeName,
                    errors,
                    source: Object.keys(infMapping).length >= 5 ? 'inf' : 'names',
                    previewCache: new Map(),
                };
            };

            // Turns a parsed cursor into data-URL frames near the given size for the live preview.
            const cursorToFrames = (cursor, size = 32) => {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const seen = new Map();
                return cursor.frames.map((f) => {
                    const img = CP.imageForSize(f.images, size);
                    if (!seen.has(img)) {
                        canvas.width = img.width;
                        canvas.height = img.height;
                        ctx.putImageData(
                            new ImageData(new Uint8ClampedArray(img.rgba), img.width, img.height),
                            0,
                            0
                        );
                        seen.set(img, canvas.toDataURL('image/png'));
                    }
                    return {
                        url: seen.get(img),
                        delay: f.delay || 100,
                        w: img.width,
                        h: img.height,
                        xhot: img.xhot,
                        yhot: img.yhot,
                    };
                });
            };

            // Plays preview frames with their own delays (browsers cannot animate CSS cursors).
            const FramePlayer = ({ frames, size, className = '', style = {} }) => {
                const [index, setIndex] = useState(0);
                useEffect(() => {
                    setIndex(0);
                    if (!frames || frames.length < 2) return undefined;
                    let i = 0;
                    let timer = null;
                    const tick = () => {
                        i = (i + 1) % frames.length;
                        setIndex(i);
                        timer = setTimeout(tick, frames[i].delay);
                    };
                    timer = setTimeout(tick, frames[0].delay);
                    return () => clearTimeout(timer);
                }, [frames]);
                const f = frames && frames[Math.min(index, frames.length - 1)];
                if (!f) return null;
                return (
                    <img
                        src={f.url}
                        alt=""
                        draggable="false"
                        className={className}
                        style={{
                            width: size,
                            height: (size * f.h) / f.w,
                            imageRendering: 'pixelated',
                            ...style,
                        }}
                    />
                );
            };

            // --- MAIN APP COMPONENT ---
            const App = () => {
                const [copied, setCopied] = useState(null);

                // Fixed mapping for Demo Packs to ensure they work regardless of user settings
                const demoMapping = {
                    normal: 'Normal',
                    working: 'Working',
                    busy: 'Busy',
                    link: 'Link',
                    text: 'Text',
                    precision: 'Precision',
                    hand: 'Handwriting',
                    unavailable: 'Unavailable',
                    not_allowed: 'Unavailable',
                    help: 'Help',
                    move: 'Move',
                    vertical: 'Vertical',

                        textArea.style.top = '0';

                        try {
                            document.execCommand('copy');

                        } catch (err) {
                            console.error('Fallback copy failed', err);
                        }
                        document.body.removeChild(textArea);
                    };
                    if (navigator.clipboard && navigator.clipboard.writeText) {
